[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-package=service
cover-erase=1

[coverage:report]
show_missing = True
fail_under = 95

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,venv

[pylint]
disable = C0114,C0115,C0116,R0903,E1101
max-line-length = 127
